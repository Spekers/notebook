<section id="comments" class="comments" data-comments-api="https://comments.sips-log.com/api/comments">
	<h2 class="comments-heading">Notes from readers</h2>
	<ol class="comments-list" id="comments-list" aria-live="polite">
		<li class="comments-empty">Loading…</li>
	</ol>

	<form class="comments-form" id="comments-form" autocomplete="off">
		<label class="comments-label">
			<span>Name</span>
			<input type="text" name="name" maxlength="60" required>
		</label>
		<label class="comments-label">
			<span>Note</span>
			<textarea name="body" maxlength="2000" rows="4" required></textarea>
		</label>
		<label class="comments-honeypot" aria-hidden="true">
			Website
			<input type="text" name="website" tabindex="-1" autocomplete="off">
		</label>
		<div class="cf-turnstile" data-sitekey="" data-theme="light"></div>
		<div class="comments-actions">
			<button type="submit">Leave a note</button>
			<span class="comments-status" id="comments-status" role="status"></span>
		</div>
	</form>
</section>
<link rel="stylesheet" href="/comments.css"/>
<script defer src="/comments.js"></script>
