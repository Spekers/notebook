    <style>

		.map {
			height:100%;
			width:100%;
			bottom:0;
			left:0;
			right:0;
			top:0px;
			margin:auto;
			overflow:hidden;
			position:fixed;
			color:white;
			background: url('background.jpg');
			background-color:#002842;
		}

		#nav {
			background:linear-gradient(#333333, #111111);
			color:#cacaca;
			width:100%;
			height:60px;
			border-color:#727272;
			box-shadow: -2px 0px 2px 2px #222222;
		}

		#content {
			background:linear-gradient(#333333, #111111);
			color:#cacaca;
			width:100%;
			height:50%;
			border-color:#727272;
			box-shadow: -2px 0px 2px 2px #222222;
			display:none;
			overflow-y: auto;
		}

		#info {
			position: relative;
			z-index: 999;
			font-size:30px;
			font-family: 'Helvetica', sans-serif;
			color:#feff9d;
			padding: 0px;
			margin:0px;
			line-height:0.8;
			display:none;
		}

		#scene {
			position: relative;
			z-index: 999;
			font-size:20px;
			font-family: 'Helvetica', sans-serif;
			color: #feff9d;
			padding: 16px 8px 16px 8px;
			border: 1px solid grey;
			background-color: black;
			margin:0px 2px 0px 0px;
			line-height:0.1;
			display: inline;
			float:right;
			display:none;
		}

		#menu {
			background:linear-gradient(#333333, #111111);
			color:#cacaca;
			width:65%;
			height:100%;
			border-color: #727272;
			box-shadow: 0px 2px 2px 2px #222222;
			z-index:999;
			display:none;
			position:fixed;
			right:0px;
			overflow-y: hidden;
		}


		#pulltab {
			background: url('menuicon.png') no-repeat;
			background-position: center;
			background-size: 100% 100%;
			z-index:999;
			position:fixed;
			top:3em;
			right: 1.5em;
			width:75px;
			height:75px;
		}
		
		.ol-zoom {
			top: 4em;
			left: 1.5em;
		}

		.ol-zoom-extent {
			margin-top:4em;
			left: 1.5em;
		}


		#pulltab:hover {
			cursor: pointer;
		}

		#contents {
			height:100%;
			width: 90%;
			margin: 0 auto;
			position:relative;
			padding-bottom:120px;
		}
		
		#spinner {
			height:100%;
			-webkit-animation-name: spin;
			-webkit-animation-duration: 400ms;
			-webkit-animation-iteration-count: infinite;
			-webkit-animation-timing-function: linear;
			-moz-animation-name: spin;
			-moz-animation-duration: 400ms;
			-moz-animation-iteration-count: infinite;
			-moz-animation-timing-function: linear;
			-ms-animation-name: spin;
			-ms-animation-duration: 400ms;
			-ms-animation-iteration-count: infinite;
			-ms-animation-timing-function: linear;
			
			animation-name: spin;
			animation-duration: 400ms;
			animation-iteration-count: infinite;
			animation-timing-function: linear;
		}
		@-ms-keyframes spin {
			from { -ms-transform: rotate(0deg); }
			to { -ms-transform: rotate(360deg); }
		}
		@-moz-keyframes spin {
			from { -moz-transform: rotate(0deg); }
			to { -moz-transform: rotate(360deg); }
		}
		@-webkit-keyframes spin {
			from { -webkit-transform: rotate(0deg); }
			to { -webkit-transform: rotate(360deg); }
		}
		@keyframes spin {
			from {
				transform:rotate(0deg);
			}
			to {
				transform:rotate(360deg);
			}
		}
		
		@media only screen and (min-width: 2000px) {
			#menu { width: 65%; }
			#contents {  width: 90%; padding-bottom:120px; }
			#nav { height:60px; }
 
		}

		@media only screen and (max-width: 1440px) {
			#menu { width: 65%; }
			#contents {  width: 90%; padding-bottom:120px; }

		}

		@media only screen and (max-width: 1040px) {

		}

		@media only screen and (max-width: 800px) {
			#menu { width: 100%; }
			#contents {  width: 98%; padding-bottom:180px; }
			#nav { height:120px; }

		}

		@media only screen and (max-width: 640px) {
			#menu { width: 100%; }
			#contents {  width: 98%; padding-bottom:180px; }

		}

		@media only screen and (max-width: 400px) {
			#menu { width: 100%; }
			#contents {  width: 98%; padding-bottom:180px; }
			#nav { height:120px; }

		}

<script>$(document).ready(function(){

$('#pulltab').css({ right:"0%" });

$('#nav').mouseover(function() {
	$('#scene').css("visibility", "hidden");
});

$('#pulltab').mouseover(function() {
	$('#scene').css("visibility", "hidden");
});

$('#pulltab').click(function() {
	$('#menu').animate({ width:"toggle" });
	$('#contents').load('menu.php');
});

$('#closemenu').click(function() {
	$('#menu').animate({ width:"toggle" });
});



if ($(window).width() > 800) {
	var menudisplay = $('#menu').css('display');
	if (menudisplay == "none") {	
		$('#pulltab').css({ right:"0%" });
	} else {
		if ($(window).width() < 800) {
			$('#pulltab').css({ right:"100%" });
		} else {
			$('#pulltab').css({ right:"65%" });
		}
	}
}

$(window).resize(function() {
	var menudisplay = $('#menu').css('display');
	if (menudisplay == "none") {	
		$('#pulltab').css({ right:"0%" });
	}
});



});</script>
